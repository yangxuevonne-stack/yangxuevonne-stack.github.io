<head>

<meta name="description" content="Video commentary on cross-border M&amp;A, AI regulation, and U.S.–China legal developments from attorney Evonne Xu. 跨境并购与 AI 法律视频解读。">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.videos-hero { background:var(--dark); padding:140px 60px 80px; text-align:center; }
.videos-hero h1 { font-family:'Cormorant Garamond',serif; font-size:56px; font-weight:300; color:var(--cream); margin-bottom:16px; }
.videos-hero p { font-size:16px; color:rgba(247,243,238,0.6); }
.videos-container { max-width:1100px; margin:0 auto; padding:60px 60px 100px; }
.videos-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.video-card { background:var(--cream); border:1px solid var(--border); overflow:hidden; transition:all 0.3s; cursor:pointer; }
.video-card:hover { box-shadow:0 16px 48px rgba(28,21,16,0.12); transform:translateY(-4px); }
.video-thumb {
  aspect-ratio:16/9; background:var(--dark); position:relative;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.video-thumb img { width:100%; height:100%; object-fit:cover; }
.video-play {
  position:absolute; width:56px; height:56px; border-radius:50%;
  background:rgba(196,154,122,0.9); display:flex; align-items:center; justify-content:center;
  font-size:20px; color:white; transition:transform 0.2s;
}
.video-card:hover .video-play { transform:scale(1.1); }
.video-platform {
  position:absolute; top:12px; right:12px;
  background:rgba(28,21,16,0.8); color:var(--champagne);
  font-size:10px; letter-spacing:2px; text-transform:uppercase;
  padding:4px 10px;
}
.video-info { padding:20px 24px; }
.video-cat { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--rose-gold); margin-bottom:10px; }
.video-title { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:400; line-height:1.4; margin-bottom:10px; color:var(--dark); }
.video-desc { font-size:13px; line-height:1.7; color:var(--light-text); }
.video-meta { font-size:11px; color:var(--rose-gold); margin-top:14px; }
.loading { text-align:center; padding:80px; color:var(--light-text); font-size:13px; letter-spacing:2px; }

/* 视频弹窗 */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(28,21,16,0.9);
  z-index:1000; align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal-inner { background:var(--dark); max-width:900px; width:90%; position:relative; }
.modal-close {
  position:absolute; top:-40px; right:0; font-size:24px; color:var(--champagne);
  cursor:pointer; background:none; border:none; transition:color 0.2s;
}
.modal-close:hover { color:var(--rose-gold); }
.modal-video { aspect-ratio:16/9; width:100%; }
.modal-video iframe { width:100%; height:100%; border:none; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">E<span>.</span>LAW</a>
  <ul class="nav-links">
    <li><a href="index.html#about">关于我</a></li>

    <li><a href="blog.html">Blog</a></li>
    <li><a href="videos.html">视频</a></li>
    <li><a href="index.html#newsletter">订阅</a></li>
    <li><a href="index.html#contact" class="nav-cta">预约咨询</a></li>
  </ul>
</nav>

<div class="videos-hero">
  <p class="section-tag" style="margin-bottom:16px;">视频内容</p>
  <h1>看得懂的<em style="font-style:italic;color:var(--rose-gold);">法律</em></h1>
  <p>YouTube · Bilibili · 小红书视频</p>
</div>

<div class="videos-container">
  <div id="videos-grid" class="videos-grid">
    <div class="loading" style="grid-column:1/-1">加载中…</div>
  </div>
</div>

<!-- 视频弹窗 -->
<div class="modal-overlay" id="videoModal" onclick="closeModal(event)">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeVideoModal()">✕</button>
    <div class="modal-video">
      <iframe id="modalIframe" src="" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
const categoryLabels = {'ai-compliance':'AI合规','ma':'跨境并购','startup-law':'创业法律'};
const platformColors = {'youtube':'#FF0000','bilibili':'#00A1D6','xiaohongshu':'#FF2442'};

// ================================================================
// 📌 新增视频时，把文件名加到这里
// ================================================================
const videoFiles = [
  '_posts/videos/xai-video.md',
];

function parseFrontmatter(text) {
  const match = text.match(/^---\n([\s\S]*?)\n---/);
  if (!match) return {};
  const data = {};
  match[1].split('\n').forEach(line => {
    const i = line.indexOf(':');
    if (i > -1) {
      data[line.slice(0,i).trim()] = line.slice(i+1).trim().replace(/^["']|["']$/g,'');
    }
  });
  return data;
}

function getEmbedUrl(url, platform) {
  if (!url) return '';
  if (platform === 'youtube') {
    const id = url.match(/(?:v=|youtu\.be\/)([^&\s]+)/)?.[1];
    return id ? `https://www.youtube.com/embed/${id}` : '';
  }
  if (platform === 'bilibili') {
    const id = url.match(/BV[\w]+/)?.[0];
    return id ? `https://player.bilibili.com/player.html?bvid=${id}&autoplay=1` : '';
  }
  return url;
}

async function loadVideos() {
  const results = await Promise.allSettled(videoFiles.map(async f => {
    try {
      const r = await fetch(f);
      if (!r.ok) return null;
      return parseFrontmatter(await r.text());
    } catch { return null; }
  }));

  const videos = results
    .filter(r => r.status==='fulfilled' && r.value && r.value.published !== 'false')
    .map(r => r.value);

  const grid = document.getElementById('videos-grid');

  if (!videos.length) {
    grid.innerHTML = '<div class="loading" style="grid-column:1/-1">暂无视频，请到后台添加内容。</div>';
    return;
  }

  grid.innerHTML = videos.map((v,i) => {
    const embedUrl = getEmbedUrl(v.videoUrl, v.platform);
    const thumbStyle = v.thumbnail
      ? `background-image:url(${v.thumbnail});background-size:cover;background-position:center;`
      : `background:linear-gradient(135deg, #1C1510, #4A3728);`;
    return `
      <div class="video-card" onclick="playVideo('${embedUrl}')">
        <div class="video-thumb" style="${thumbStyle}">
          <div class="video-play">▶</div>
          <div class="video-platform">${v.platform||'VIDEO'}</div>
        </div>
        <div class="video-info">
          <div class="video-cat">${categoryLabels[v.category]||'AI法律'}</div>
          <div class="video-title">${v.title||'无标题'}</div>
          <p class="video-desc">${v.description||''}</p>
          <div class="video-meta">${v.date||''}</div>
        </div>
      </div>`;
  }).join('');
}

function playVideo(embedUrl) {
  if (!embedUrl) return;
  document.getElementById('modalIframe').src = embedUrl;
  document.getElementById('videoModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeVideoModal() {
  document.getElementById('modalIframe').src = '';
  document.getElementById('videoModal').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModal(e) {
  if (e.target === document.getElementById('videoModal')) closeVideoModal();
}

loadVideos();
</script>
</body>
</html>
